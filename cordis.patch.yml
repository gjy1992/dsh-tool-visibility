# dsh-tool-visibility — composition bundle patch
#
# Installed as a profile bundle (dsh.bundle), this inserts the plugin row into
# the root composition. At root scope `ctx.tools.restrict` is unavailable (dsh
# rejects a context-global restriction), so the plugin degrades to the
# system-prompt/assemble waterfall filter — which still removes the schemas from
# the model context, but does not make the tools uncallable.
#
# For full per-scope semantics (restrict + UNKNOWN_TOOL), add the row to an
# agent preset copy instead (editing-cordis-compositions workflow):
#   - id: tool-visibility
#     name: '@rayfalling/dsh-tool-visibility'
- insert:
    - id: tool-visibility
      name: '@rayfalling/dsh-tool-visibility'
