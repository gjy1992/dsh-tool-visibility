# dsh-tool-visibility — composition bundle patch
#
# Installed as a profile bundle (dsh.bundle), this inserts the plugin row into
# the root composition. At root scope `ctx.tools.restrict` is unavailable, so
# the plugin degrades to the system-prompt/assemble waterfall filter.
#
# For full per-scope semantics (restrict + UNKNOWN_TOOL), add the row to an
# agent preset copy instead (editing-cordis-compositions workflow):
#   - id: tool-visibility
#     name: dsh-tool-visibility
- insert:
    - id: tool-visibility
      name: dsh-tool-visibility
